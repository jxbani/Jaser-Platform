# /etc/nginx/conf.d/jaser.conf
# Rendered from .env.web by first-boot via envsubst.
# Reverse-proxies the Next.js cluster (App VLAN) and terminates TLS.

# ---- Rate limits ----------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=${RATE_LIMIT_API}r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=${RATE_LIMIT_AUTH}r/s;

# ---- Upstream pool --------------------------------------------------------
include /etc/nginx/conf.d/jaser.upstreams;

# ---- HTTP -> HTTPS redirect ----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# ---- TLS edge -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SERVER_NAME};

    ssl_certificate     ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:CHACHA20:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;

    # Auth endpoints — stricter limit
    location ~ ^/api/auth/(signin|signup|callback) {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://jaser_app;
        include /etc/nginx/conf.d/jaser.proxy_headers;
    }

    # General API
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://jaser_app;
        include /etc/nginx/conf.d/jaser.proxy_headers;
    }

    # Static Next.js assets — long-cache, served straight from upstream
    location /_next/static/ {
        proxy_pass http://jaser_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/jaser.proxy_headers;
    }

    # Everything else — SSR pages
    location / {
        proxy_pass http://jaser_app;
        include /etc/nginx/conf.d/jaser.proxy_headers;
    }

    # Web-tier-local health
    location = /healthz { access_log off; return 200 "ok\n"; }
}
