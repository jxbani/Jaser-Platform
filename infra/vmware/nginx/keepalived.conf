# /etc/keepalived/keepalived.conf
# Floating VIP between jaser-web-01 and jaser-web-02.
# Render via envsubst from .env.web — KEEPALIVED_PRIORITY differs per host
# (100 on the primary, 90 on the backup).

global_defs {
    router_id JASER_WEB
    enable_script_security
    script_user root
}

vrrp_script chk_nginx {
    script   "/usr/bin/curl -fsS -m 2 http://127.0.0.1/healthz"
    interval 2
    weight   -20
    fall     2
    rise     2
}

vrrp_instance VI_JASER_WEB {
    state            BACKUP        # both nodes BACKUP; priority decides master
    interface        eth0
    virtual_router_id ${KEEPALIVED_VRID}
    priority         ${KEEPALIVED_PRIORITY}
    advert_int       1
    authentication {
        auth_type PASS
        auth_pass ${KEEPALIVED_AUTH_PASS}
    }
    virtual_ipaddress {
        ${KEEPALIVED_VIP}/24
    }
    track_script { chk_nginx }
}
